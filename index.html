<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>ShopEasy</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#products">Products</a>
        <a href="#cart">Cart 🛒</a>
    </nav>
</header>

<section class="banner">
    <h2>Welcome to ShopEasy</h2>
    <p>Discover amazing products at great prices!</p>
</section>

<h2 class="heading" id="products">Our Products</h2>
<div class="products">
    <div class="product">
        <img src="https://placehold.co/200x150?text=Headphones" alt="Headphones">
        <h3>Headphones</h3>
        <p>₹999</p>
        <button onclick="addToCart('Headphones', 999)">Add to Cart</button>
    </div>
    <div class="product">
        <img src="https://placehold.co/200x150?text=Smart+Watch" alt="Smart Watch">
        <h3>Smart Watch</h3>
        <p>₹1499</p>
        <button onclick="addToCart('Smart Watch', 1499)">Add to Cart</button>
    </div>
    <div class="product">
        <img src="https://placehold.co/200x150?text=Shoes" alt="Shoes">
        <h3>Shoes</h3>
        <p>₹1999</p>
        <button onclick="addToCart('Shoes', 1999)">Add to Cart</button>
    </div>
    <div class="product">
        <img src="https://placehold.co/200x150?text=Backpack" alt="Backpack">
        <h3>Backpack</h3>
        <p>₹799</p>
        <button onclick="addToCart('Backpack', 799)">Add to Cart</button>
    </div>
</div>

<section class="cart" id="cart">
    <h2>Shopping Cart</h2>
    <ul id="cart-items"></ul>
    <h3>Total: ₹<span id="total">0</span></h3>
</section>

<footer>
    <p>© 2026 ShopEasy. All Rights Reserved.</p>
</footer>
<script src="script.js"></script>
</body>
</html>
